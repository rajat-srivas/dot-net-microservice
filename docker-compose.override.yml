version: '3.4'

services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  discountdb:
    container_name: discountdb
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=DiscountDB
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  portainer:
    container_name: portainer
    ports:
      - "8080:8000"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  catalogapi:
    container_name: catalogAPI
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #override appsetting content here
      - "DatabaseSettings__ConnectionString=mongodb://catalogdb:27017"
    depends_on:
      - catalogdb
    ports:
      - "8000:80" #host_port:docker_container_port
   
  basketapi:
    container_name: basketapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #override
      - "CacheSettings__RedisCache=basketdb:6379"
    depends_on:
      - basketdb
    ports:
      - "8001:80"  

  discountapi:
    container_name: discountapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #override
      - "DatabaseSettings__ConnectionString=host=discountdb;Port=5432;Database=DiscountDB;User Id=admin;Password=admin;"
    depends_on:
      - discountdb
    ports:
      - "8002:80" 
